<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фізичне лото · Лабораторія пригод</title><link rel="stylesheet" href="../style.css"></head><body><header><a href="../index.html">← Позакласна робота</a><a href="../../">✦ Лабораторія пригод</a></header><main><a href="./">← Тиждень фізики</a><h1>Фізичне лото</h1><p>Поєднай кожне явище з поясненням. Кожне пояснення використовуй один раз. Обговоріть вибір у команді й перевірте відповіді.</p><div id="board" class="grid"></div><button id="check">Перевірити</button><button id="reset">Почати заново</button><p id="result" class="status" role="status"></p></main><footer>Анна Сюмар · Фізика, що надихає досліджувати</footer><script>const $=s=>document.querySelector(s);const pairs=[["Краплі на холодній склянці", "Водяна пара з повітря конденсується на холодній поверхні."], ["Відображення у дзеркалі", "Світло відбивається від гладкої поверхні."], ["Нагрівання ложки в чаї", "Внутрішня енергія передається завдяки теплопровідності."], ["Падіння м’яча", "На м’яч діє сила тяжіння."], ["Звук гітарної струни", "Коливання струни спричиняють звукові коливання повітря."], ["Натирання долонь", "Під час тертя механічна енергія переходить у внутрішню."]];function reset(){const order=[3,0,5,2,1,4];$('#board').innerHTML=pairs.map((p,i)=>'<div class="card"><h2>'+p[0]+'</h2><label>Пояснення <select data-row="'+i+'"><option value="">Обери пояснення</option>'+order.map(j=>'<option value="'+j+'">'+pairs[j][1]+'</option>').join('')+'</select></label><p id="r'+i+'" role="status"></p></div>').join('');$('#result').textContent=''}$('#check').onclick=()=>{let n=0;document.querySelectorAll('[data-row]').forEach(s=>{const ok=s.value!==''&&s.value===s.dataset.row;if(ok)n++;$('#r'+s.dataset.row).textContent=s.value===''?'Обери пояснення.':ok?'✓ Правильно!':'Спробуй інше пояснення.'});$('#result').textContent='Правильно: '+n+' із 6'+(n===6?' · Лото зібрано!':'')};$('#reset').onclick=reset;reset();</script></body></html>
