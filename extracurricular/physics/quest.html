<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Код фізичної лабораторії · Лабораторія пригод</title><link rel="stylesheet" href="../style.css"></head><body><header><a href="../index.html">← Позакласна робота</a><a href="../../">✦ Лабораторія пригод</a></header><main><a href="./">← Тиждень фізики</a><h1>Код фізичної лабораторії</h1><p>П’ять станцій · 20–25 хв · Команди по 4–5 учнів. Кожна правильна відповідь відкриває цифру. Збери їх у порядку станцій та відкрий лабораторію.</p><label>Рівень: <select id="grade"><option value="7">7 клас</option><option value="8">8 клас</option><option value="9">9 клас</option></select></label><button id="restart">Почати заново</button><p id="code"></p><progress id="progress" max="5" value="0" aria-label="Пройдено станцій"></progress><article class="card" id="game"><span id="station" class="tag"></span><div id="question"></div><div id="options" class="options"></div><p id="feedback" class="status" role="status"></p><button id="hint">Підказка</button><p id="hinttext"></p><button id="next" disabled>Наступний крок →</button></article><article id="finish"></article></main><footer>Анна Сюмар · Фізика, що надихає досліджувати</footer><script>const $=s=>document.querySelector(s);const banks={"7": [{"t": "Упізнай прилад: ним вимірюють проміжки часу.", "opts": ["Термометр", "Секундомір", "Мензурка"], "a": 1, "h": "Пригадай прилад, потрібний для вимірювання тривалості бігу.", "e": "Секундомір вимірює проміжки часу.", "art": ""}, {"t": "Між позначками 0 і 1 см — п’ять рівних інтервалів. Яка ціна поділки?", "opts": ["0,2 см", "0,5 см", "5 см"], "a": 0, "h": "Поділи різницю значень на кількість інтервалів.", "e": "(1 − 0) : 5 = 0,2 см.", "art": "<svg viewBox=\"0 0 360 100\" role=\"img\" aria-label=\"Шкала лінійки: між 0 і 1 сантиметром п’ять рівних інтервалів\"><rect x=\"10\" y=\"10\" width=\"340\" height=\"75\" fill=\"#f3dfab\"/><path d=\"M40 20v45 M90 20v25 M140 20v25 M190 20v25 M240 20v25 M290 20v45\" stroke=\"#183d42\" stroke-width=\"3\"/><text x=\"33\" y=\"82\" font-size=\"18\">0</text><text x=\"283\" y=\"82\" font-size=\"18\">1 см</text></svg>"}, {"t": "Чому запах парфумів поступово поширюється кімнатою навіть без помітного руху повітря?", "opts": ["Молекули збільшуються", "Молекули зникають", "Відбувається дифузія"], "a": 2, "h": "Молекули постійно хаотично рухаються.", "e": "Дифузія — взаємне проникнення частинок речовин унаслідок їхнього хаотичного руху.", "art": ""}, {"t": "Візок пройшов шлях l = 12 м за t = 4 с. Яка його середня швидкість?", "opts": ["48 м/с", "3 м/с", "8 м/с"], "a": 1, "h": "v = l / t.", "e": "v = 12 / 4 = 3 м/с.", "art": ""}, {"t": "Знайди правильне виправлення: «Усі тіла однакової маси мають однаковий об’єм».", "opts": ["Об’єм залежить також від густини речовини", "Маса завжди дорівнює об’єму", "Об’єм не можна виміряти"], "a": 0, "h": "Порівняй кілограм вати й кілограм металу.", "e": "За однакової маси об’єм V = m / ρ залежить від густини.", "art": ""}], "8": [{"t": "Яким приладом вимірюють температуру?", "opts": ["Динамометром", "Термометром", "Секундоміром"], "a": 1, "h": "Прилад має шкалу у градусах.", "e": "Температуру вимірюють термометром.", "art": ""}, {"t": "Між 20 °C і 30 °C на шкалі — п’ять рівних інтервалів. Ціна поділки?", "opts": ["2 °C", "5 °C", "10 °C"], "a": 0, "h": "Різницю 30 − 20 поділи на 5.", "e": "(30 − 20) / 5 = 2 °C.", "art": ""}, {"t": "Чому металева ложка в гарячому чаї нагрівається?", "opts": ["Через випаровування металу", "Через дифузію ложки", "Через теплопровідність"], "a": 2, "h": "Енергія передається від гарячішої частини до холоднішої.", "e": "Теплопровідність забезпечує передачу внутрішньої енергії вздовж ложки.", "art": ""}, {"t": "Нагріли 0,1 кг води на 10 °C. c = 4200 Дж/(кг·°C). Яка кількість теплоти?", "opts": ["420 Дж", "4200 Дж", "42 000 Дж"], "a": 1, "h": "Q = cmΔt.", "e": "Q = 4200 · 0,1 · 10 = 4200 Дж.", "art": ""}, {"t": "Виправ: «Під час плавлення кристалічної речовини її температура постійно зростає» (сталий тиск).", "opts": ["Температура залишається сталою, поки триває плавлення", "Температура завжди падає до нуля", "Речовина не отримує енергії"], "a": 0, "h": "Енергія витрачається на зміну стану речовини.", "e": "За сталого тиску під час плавлення чистої кристалічної речовини температура стала.", "art": ""}], "9": [{"t": "Яким приладом вимірюють силу?", "opts": ["Мензуркою", "Динамометром", "Вольтметром"], "a": 1, "h": "Прилад часто має пружину та шкалу в ньютонах.", "e": "Динамометр вимірює силу.", "art": ""}, {"t": "Між 0 і 2 Н на шкалі — десять рівних інтервалів. Ціна поділки?", "opts": ["0,2 Н", "2 Н", "5 Н"], "a": 0, "h": "Різницю значень поділи на 10.", "e": "(2 − 0) / 10 = 0,2 Н.", "art": ""}, {"t": "Пасажир відхиляється вперед при різкому гальмуванні автобуса. Чому?", "opts": ["Зникає сила тяжіння", "Повітря штовхає його вперед", "Тіло прагне зберегти попередню швидкість"], "a": 2, "h": "Пригадай інертність тіл.", "e": "Через інертність тіло пасажира зберігає швидкість, коли автобус сповільнюється.", "art": ""}, {"t": "Тіло масою 2 кг рухається зі швидкістю 3 м/с. Його кінетична енергія?", "opts": ["6 Дж", "9 Дж", "18 Дж"], "a": 1, "h": "Eк = mv² / 2.", "e": "Eк = 2 · 3² / 2 = 9 Дж.", "art": ""}, {"t": "Виправ: «Сили дії та протидії завжди зрівноважують одна одну».", "opts": ["Вони діють на різні тіла", "Вони спрямовані в один бік", "Вони мають різні модулі"], "a": 0, "h": "Для зрівноваження сили мають діяти на одне тіло.", "e": "За третім законом Ньютона ці сили рівні за модулем, протилежні за напрямком і діють на різні тіла.", "art": ""}]};let step=0,done=false;const digits=['4','7','2','9','5'];let found=[];
function start(){$('#game').classList.remove('hidden');step=0;found=[];$('#finish').innerHTML='';render()}
function render(){done=false;const q=banks[$('#grade').value][step];$('#station').textContent=['01 · Упізнай прилад','02 · Прочитай шкалу','03 · Поясни явище','04 · Розв’яжи задачу','05 · Виправ помилку'][step];$('#progress').value=step;$('#code').textContent='Зібраний код: '+Array.from({length:5},(_,i)=>found[i]||'□').join(' ');$('#question').innerHTML=q.art+'<h2>'+q.t+'</h2>';$('#options').innerHTML=q.opts.map((x,i)=>'<button data-i="'+i+'">'+x+'</button>').join('');$('#feedback').textContent='';$('#hinttext').textContent='';$('#next').disabled=true;document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(done)return; if(+b.dataset.i===q.a){done=true;found[step]=digits[step];b.classList.add('correct');$('#feedback').textContent='Правильно! '+q.e+' Цифра коду: '+digits[step];$('#next').disabled=false;document.querySelectorAll('[data-i]').forEach(x=>x.disabled=true)}else{b.classList.add('wrong');b.disabled=true;$('#feedback').textContent='Спробуй ще раз. Скористайся підказкою.'}})}
$('#hint').onclick=()=>$('#hinttext').textContent=banks[$('#grade').value][step].h;$('#grade').onchange=start;$('#restart').onclick=start;
$('#next').onclick=()=>{if(!done)return;if(step<4){step++;render()}else{$('#progress').value=5;$('#code').textContent='Зібраний код: '+found.join(' ');$('#game').classList.add('hidden');$('#finish').innerHTML='<h2>Усі станції пройдено!</h2><p>Введи п’ятицифровий код, щоб відкрити лабораторію.</p><label>Код <input id="lock" inputmode="numeric" maxlength="5"></label><button id="unlock">Відкрити</button><p id="lockstatus" role="status"></p>';$('#unlock').onclick=()=>{$('#lockstatus').textContent=$('#lock').value.trim()===found.join('')?'Лабораторію відкрито! Ви — команда дослідників. Поясніть одне явище своїми словами.':'Перевір порядок зібраних цифр.'}}};const oldstart=start;start=()=>{$('#game').classList.remove('hidden');oldstart()};start();</script></body></html>
