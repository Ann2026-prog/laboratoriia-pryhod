<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Знайди помилку · Лабораторія пригод</title><link rel="stylesheet" href="../style.css"></head><body><header><a href="../index.html">← Позакласна робота</a><a href="../../">✦ Лабораторія пригод</a></header><main><a href="./">← Тиждень фізики</a><h1>Знайди помилку</h1><p>Прочитай хибне пояснення побутової ситуації. Спочатку обговоріть помилку, потім оберіть правильне виправлення. Один вибір на ситуацію.</p><article class="card"><span id="counter" class="tag"></span><h2 id="statement"></h2><div id="choices" class="options"></div><p id="feedback" class="status" role="status"></p><button id="next" disabled>Далі →</button><button id="reset">Почати заново</button></article></main><footer>Анна Сюмар · Фізика, що надихає досліджувати</footer><script>const $=s=>document.querySelector(s);const items=[{"t": "«Метал у кімнаті холодніший за дерево, бо на дотик холодніший».", "opts": ["За однакової кімнатної температури метал швидше відводить тепло від руки", "Метал завжди має температуру 0 °C", "Дерево виробляє тепло"], "a": 0, "h": "Порівняй теплопровідність.", "e": "Після тривалого перебування в кімнаті обидва предмети мають близьку температуру, але метал краще проводить тепло.", "art": ""}, {"t": "«Краплі зовні холодної склянки просочилися крізь скло».", "opts": ["Скло плавиться", "Водяна пара з повітря конденсується", "Вода виникає з нічого"], "a": 1, "h": "Звідки береться вода на холодній поверхні?", "e": "На холодній поверхні конденсується водяна пара з навколишнього повітря.", "art": ""}, {"t": "«Під час гальмування автобуса пасажира штовхає вперед особлива сила».", "opts": ["Тяжіння вимикається", "Маса пасажира збільшується", "Тіло пасажира зберігає попередню швидкість через інертність"], "a": 2, "h": "Пригадай інертність.", "e": "Автобус сповільнюється, а тіло пасажира прагне зберегти швидкість.", "art": ""}, {"t": "«На гладкому льоду зручніше ходити, бо тертя менше».", "opts": ["За малого тертя легше посковзнутися", "Тертя заважає будь-якій ходьбі", "На льоду немає сили тяжіння"], "a": 0, "h": "Що дозволяє нозі відштовхуватися від опори?", "e": "Для впевненої ходьби потрібне достатнє тертя між взуттям і опорою.", "art": ""}, {"t": "«Мокра білизна може висохнути лише за температури 100 °C».", "opts": ["Вода випаровується тільки на сонці", "Випаровування відбувається за різних температур", "Білизна поглинає воду з повітря під час висихання"], "a": 1, "h": "Розрізни кипіння й випаровування.", "e": "Випаровування з поверхні води відбувається за різних температур.", "art": ""}, {"t": "«Дзеркало саме випромінює світло й тому показує обличчя».", "opts": ["Дзеркало створює копію предмета", "Обличчя видно через тяжіння", "Дзеркало відбиває світло від освітленого обличчя"], "a": 2, "h": "Пригадай відбивання світла.", "e": "Світло від освітленого предмета відбивається від дзеркала та потрапляє в очі.", "art": ""}, {"t": "«Пухова куртка сама виробляє тепло».", "opts": ["Куртка зменшує втрату тепла тілом", "Куртка нагріває повітря електричним струмом", "Холод не існує поза курткою"], "a": 0, "h": "Повітря між волокнами погано проводить тепло.", "e": "Звичайна пухова куртка зменшує тепловіддачу тіла, утримуючи шар повітря.", "art": ""}, {"t": "«Що сильніше притиснути долоні під час натирання, то менше вони нагріваються».", "opts": ["Тертя повністю зникає", "За однакового руху більше тертя сприяє більшому нагріванню", "Долоні нагріваються лише від сонця"], "a": 1, "h": "Механічна енергія переходить у внутрішню.", "e": "Натирання долонь збільшує їхню внутрішню енергію завдяки роботі сил тертя.", "art": ""}];let index=0,score=0,answered=false;function render(){answered=false;$('#counter').textContent='Ситуація '+(index+1)+' із '+items.length;$('#statement').textContent=items[index].t;$('#choices').innerHTML=items[index].opts.map((t,i)=>'<button data-choice="'+i+'">'+t+'</button>').join('');$('#feedback').textContent='';$('#next').disabled=true;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=+b.dataset.choice===items[index].a;if(ok)score++;b.classList.add(ok?'correct':'wrong');document.querySelectorAll('[data-choice]').forEach(x=>{x.disabled=true;if(+x.dataset.choice===items[index].a)x.classList.add('correct')});$('#feedback').textContent=(ok?'Правильно! ':'Правильне пояснення позначене зеленим. ')+items[index].e;$('#next').disabled=false})}$('#next').onclick=()=>{if(!answered)return;if(index+1<items.length){index++;render()}else{$('#counter').textContent='Завершено';$('#statement').textContent='Результат: '+score+' із '+items.length;$('#choices').innerHTML='';$('#feedback').textContent='Оберіть одну ситуацію й поясніть її без підказки.';$('#next').disabled=true}};$('#reset').onclick=()=>{index=0;score=0;render()};render();</script></body></html>
