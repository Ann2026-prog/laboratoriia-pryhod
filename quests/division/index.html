<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#112940">
  <meta name="description" content="Десять практичних завдань з ділення натуральних чисел для учнів 5 класу.">
  <title>Квест ділення · 5 клас</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23112940'/%3E%3Ccircle cx='32' cy='17' r='4' fill='%23f8cf73'/%3E%3Cpath d='M16 32h32' stroke='%23f8cf73' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='47' r='4' fill='%23f8cf73'/%3E%3C/svg%3E">
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#183049;background:#e9f2f5;font-size:16px}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 95% 3%,#b8e7ee 0,transparent 29rem),linear-gradient(135deg,#f0f8fa,#dcebf0)} button,input{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible{outline:3px solid #137b99;outline-offset:3px}
    .topbar{background:#112940;color:#fff;padding:1rem max(1.25rem,calc((100vw - 1150px)/2));display:flex;align-items:center;justify-content:space-between;gap:1rem;box-shadow:0 4px 16px #102c4250}
    .brand{display:flex;align-items:center;gap:.8rem;min-width:0}.crest{width:2.8rem;height:2.8rem;flex:none;border:2px solid #f8cf73;border-radius:.8rem;display:grid;place-items:center;color:#f8cf73;font-size:2rem;line-height:1;font-weight:700;box-shadow:inset 0 0 0 3px #112940,0 0 0 1px #f8cf7375}
    h1,h2,h3,p{margin-top:0}.brand h1{font-family:Georgia,serif;font-size:1.42rem;line-height:1.15;margin:0}.brand small{display:block;color:#bdd3e1;font-size:.8rem;margin-top:.2rem}.xp{background:#23465f;border:1px solid #58758a;border-radius:999px;padding:.6rem .9rem;white-space:nowrap;font-weight:750;color:#ffe1a0}.xp span{color:#fff;font-variant-numeric:tabular-nums}
    main{max-width:1150px;margin:auto;padding:1.5rem 1.25rem 3rem}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:1.25rem;align-items:start}
    .map,.quest{background:#fff;border:1px solid #bdd0db;box-shadow:0 10px 26px #23465f17;border-radius:1.25rem}.map{padding:1.2rem;position:sticky;top:1rem}.map h2{font:700 1.2rem Georgia,serif;margin-bottom:.35rem}.map p{font-size:.9rem;color:#526c7b;margin-bottom:1rem}.progress{height:.65rem;background:#d9e8ed;border-radius:99px;overflow:hidden;margin-bottom:1.1rem}.progress-fill{width:0;height:100%;background:linear-gradient(90deg,#10a4a2,#e9b547);transition:width .3s}.steps{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}.steps li{display:flex;align-items:center;gap:.65rem;padding:.62rem .7rem;border-radius:.75rem;background:#f2f7f8;color:#496273;font-size:.88rem;line-height:1.25}.steps li.current{background:#d7f3f1;color:#103d4b;font-weight:750;box-shadow:inset 0 0 0 2px #20a6a3}.steps li.done{color:#246a54;background:#e8f7ef}.step-number{width:1.65rem;height:1.65rem;border-radius:.5rem;display:grid;place-items:center;flex:none;background:#d8e5ea;font-weight:800;color:#3c5968}.current .step-number{background:#119c9d;color:#fff}.done .step-number{background:#2aa271;color:#fff}
    .quest{overflow:hidden}.quest-head{background:#18384f;color:#fff;padding:1.15rem 1.5rem;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;font-weight:800;color:#f8cf73;margin-bottom:.35rem}.quest-head h2{font:700 clamp(1.6rem,3vw,2.25rem)/1.15 Georgia,serif;margin:0}.reward{background:#f8cf73;color:#3b2d10;font-weight:800;border-radius:.6rem;padding:.5rem .65rem;white-space:nowrap}.quest-body{padding:1.5rem}.story{color:#4d6372;line-height:1.55;margin-bottom:1.2rem}.problem{background:#f2f8fa;border-left:5px solid #15a6a5;border-radius:.65rem;padding:1.1rem 1.15rem;font-size:clamp(1.1rem,2vw,1.3rem);font-weight:700;line-height:1.5;margin-bottom:1.3rem}.input-group{display:flex;align-items:center;flex-wrap:wrap;gap:.65rem;margin-bottom:1rem}.input-group label{font-weight:700;min-width:12rem}.answer{width:min(100%,14rem);padding:.78rem .9rem;border:2px solid #9db7c3;border-radius:.7rem;background:#fff;color:#163348;font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}.answer:disabled{background:#e9f5ee;color:#246a54;border-color:#59b488}.unit{color:#45606c;font-weight:600}.actions{display:flex;gap:.7rem;flex-wrap:wrap;margin:1.3rem 0}.primary,.secondary{border-radius:.7rem;padding:.78rem 1rem;font-weight:800;min-height:2.9rem}.primary{background:#0d8289;color:white;border:2px solid #0d8289;box-shadow:0 4px 0 #075d67}.primary:hover{background:#086c74}.secondary{background:#fff;color:#1d526b;border:2px solid #aac8d3}.secondary:hover{background:#e9f6f7}.primary:disabled{opacity:.55;cursor:default;box-shadow:none}
    .hint,.feedback{border-radius:.75rem;padding:.85rem 1rem;line-height:1.5;margin-top:.75rem}.hint{background:#fff4d7;border:1px solid #e9c46c;color:#58431d}.feedback{background:#fff1ed;border:1px solid #e9aa99;color:#7c332c}.feedback.success{background:#e7f7ed;border-color:#82cda1;color:#18563b}.feedback:empty,.hint[hidden],.feedback[hidden]{display:none}.rule{border-top:1px solid #d8e5e8;margin-top:1.4rem;padding-top:1rem;color:#405c69;line-height:1.5}.rule strong{color:#173a50}.finish{background:#f2f9ee;border:2px solid #a7d495;border-radius:.8rem;padding:1rem;margin-top:1.2rem}.finish h3{font:700 1.4rem Georgia,serif;margin-bottom:.4rem;color:#245a3d}.finish p{margin-bottom:.9rem}.small{font-size:.87rem;color:#58707c}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:760px){.topbar{padding:.85rem 1rem}.brand h1{font-size:1.1rem}.crest{width:2.3rem;height:2.3rem;font-size:1.7rem}.xp{font-size:.85rem;padding:.5rem .65rem}main{padding:1rem .75rem 2rem}.layout{display:flex;flex-direction:column;gap:.85rem}.map{position:static;width:100%;padding:.9rem}.map h2,.map p{display:none}.progress{margin:0 0 .65rem}.steps{display:flex;overflow-x:auto;gap:.3rem;padding-bottom:.1rem}.steps li{padding:.35rem;background:transparent;min-width:2.2rem}.steps li .step-label{display:none}.steps li.current{box-shadow:none;background:#d7f3f1}.step-number{width:1.8rem;height:1.8rem}.quest{width:100%}.quest-head{padding:1rem}.quest-body{padding:1rem}.problem{padding:.9rem}.input-group{align-items:flex-start;flex-direction:column}.answer{width:100%}.actions button{flex:1 1 10rem}}
    @media(prefers-reduced-motion:reduce){.progress-fill{transition:none}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="crest" aria-hidden="true">÷</div><div><h1>Квест ділення</h1><small>Математика · 5 клас</small></div></div><div class="xp" aria-live="polite" aria-label="Бали досвіду">✦ <span id="xp">0</span> / 100 XP</div></header>
  <main><div class="layout">
    <aside class="map" aria-label="Шлях квесту"><h2>Шлях дослідника</h2><p id="progress-label">Виконано 0 із 10 завдань</p><div class="progress" role="progressbar" aria-label="Виконання квесту" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress"><div class="progress-fill" id="progress-fill"></div></div><ol class="steps" id="steps"></ol></aside>
    <section class="quest" aria-labelledby="quest-title"><div class="quest-head"><div><div class="eyebrow" id="quest-count">Завдання 1 із 10</div><h2 id="quest-title"></h2></div><div class="reward">+10 XP</div></div><div class="quest-body"><p class="story" id="story"></p><div class="problem" id="problem"></div><form id="answer-form" novalidate><div id="fields"></div><div class="actions"><button class="primary" id="check" type="submit">Перевірити відповідь</button><button class="secondary" id="hint-button" type="button" aria-expanded="false">Підказка</button></div></form><div class="hint" id="hint" hidden></div><div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div><div class="rule"><strong>Математичний ключ:</strong> <span id="rule"></span></div><div id="finish"></div></div></section>
  </div></main>
  <script>
    "use strict";
    const tasks = [
      {title:"Олівці для загонів",story:"Канцелярію готують для команд дослідників.",problem:"168 олівців розклали порівну в 7 коробок. Скільки олівців у кожній коробці?",labels:["В одній коробці"],units:["олівців"],answers:[24],hint:"Знайди число, яке при множенні на 7 дає 168.",rule:"Ділення перевіряють множенням: якщо a : b = c, то b × c = a.",solution:"168 : 7 = 24 олівці; 24 × 7 = 168."},
      {title:"Ціна блокнота",story:"Для квесту купують однакові блокноти.",problem:"За 25 блокнотів заплатили 525 грн. Скільки коштує один блокнот?",labels:["Ціна одного"],units:["грн"],answers:[21],hint:"Поділи загальну вартість на кількість блокнотів: 525 : 25.",rule:"Ціна одного предмета = загальна вартість : кількість предметів.",solution:"525 : 25 = 21 грн."},
      {title:"Пакунки карток",story:"Картки складають у пакунки однакового розміру.",problem:"Є 182 картки. У кожному пакунку має бути по 14 карток. Скільки пакунків вийде?",labels:["Кількість"],units:["пакунків"],answers:[13],hint:"14 × 10 = 140. Скільки пакунків вийде з решти 42 карток?",rule:"Кількість груп = загальна кількість : кількість в одній групі.",solution:"182 : 14 = 13 пакунків."},
      {title:"Афіші для класів",story:"Кожен клас отримає однакову кількість афіш.",problem:"900 афіш поділили порівну між 10 класами. Скільки афіш отримав кожен клас?",labels:["Один клас отримав"],units:["афіш"],answers:[90],hint:"При діленні 900 на 10 прибери один нуль у кінці числа.",rule:"Щоб поділити число, що закінчується нулем, на 10, прибери один нуль у кінці запису.",solution:"900 : 10 = 90 афіш."},
      {title:"Жетони для гравців",story:"Команди розподіляють жетони порівну.",problem:"360 жетонів ділять між 6 командами, у кожній із яких по 5 гравців. Скільки жетонів отримає один гравець?",labels:["Один гравець отримає"],units:["жетонів"],answers:[12],hint:"Спочатку знайди кількість гравців: 6 × 5. Тепер обчисли 360 : 30.",rule:"Ділення на добуток: a : (b × c) = (a : b) : c, якщо ділення виконується без остачі.",solution:"360 : (6 × 5) = 360 : 30 = 12 жетонів."},
      {title:"Два кольори олівців",story:"Майстерня робить однакові набори з кольорових олівців.",problem:"240 зелених і 160 синіх олівців розклали порівну у 8 наборів. Скільки всього олівців в одному наборі?",labels:["В одному наборі"],units:["олівців"],answers:[50],hint:"Знайди окремо 240 : 8 та 160 : 8. Додай результати.",rule:"Ділення суми: (a + b) : c = a : c + b : c, коли обидва доданки діляться на c.",solution:"(240 + 160) : 8 = 30 + 20 = 50 олівців."},
      {title:"Наліпки для класів",story:"Наліпки з однакових пакунків ділять між класами.",problem:"Є 45 пакунків по 8 наліпок. Усі наліпки роздали порівну між 5 класами. Скільки наліпок отримав кожен клас?",labels:["Один клас отримав"],units:["наліпок"],answers:[72],hint:"Оскільки 45 ділиться на 5, спочатку знайди 45 : 5, а тоді помнож на 8.",rule:"Якщо один множник ділиться на число, можна поділити цей множник, а результат помножити на другий.",solution:"(45 × 8) : 5 = (45 : 5) × 8 = 72 наліпки."},
      {title:"Один загін і конверти",story:"Майстерня розподіляє 600 наліпок двома способами.",problem:"Скільки наліпок дістанеться одному загону, якщо віддати йому всі 600? Скільки буде в кожному із 600 однакових конвертів, якщо розкласти по них усі наліпки порівну?",labels:["Одному загону","В одному конверті"],units:["наліпок","наліпок"],answers:[600,1],hint:"Поділи 600 спочатку на 1, а потім на саме число 600.",rule:"a : 1 = a; a : a = 1, якщо a ≠ 0.",solution:"600 : 1 = 600 наліпок; 600 : 600 = 1 наліпка."},
      {title:"Початок гри",story:"Бонусні жетони ще не нарахували.",problem:"До початку гри є 0 бонусних жетонів. Якщо розділити їх порівну між 12 гравцями, скільки жетонів отримає кожен?",labels:["Кожен отримає"],units:["жетонів"],answers:[0],hint:"Нуль, поділений на будь-яке число, відмінне від нуля, дорівнює нулю.",rule:"0 : a = 0, якщо a ≠ 0. На нуль ділити не можна.",solution:"0 : 12 = 0 жетонів."},
      {title:"Фінальна майстерня",story:"Підготуй матеріали для останнього етапу квесту.",problem:"1260 намистин розклали порівну в 7 наборів. Кожен набір поділили ще на 3 однакові пакетики. Скільки намистин в одному пакетику?",labels:["В одному пакетику"],units:["намистин"],answers:[60],hint:"Обчисли послідовно: 1260 : 7, а потім результат поділи на 3.",rule:"Якщо ділення виконується без остачі, послідовне ділення на b і c дорівнює діленню на b × c.",solution:"(1260 : 7) : 3 = 180 : 3 = 60 намистин."}
    ];
    let current = 0;
    const solved = Array(tasks.length).fill(false);
    const $ = id => document.getElementById(id);
    function updateMap(){
      const count=solved.filter(Boolean).length;
      $("xp").textContent=String(count*10);
      $("progress-label").textContent=`Виконано ${count} із 10 завдань`;
      $("progress").setAttribute("aria-valuenow",String(count));
      $("progress-fill").style.width=`${count/10*100}%`;
      $("steps").innerHTML=tasks.map((t,i)=>`<li class="${solved[i]?"done":i===current?"current":""}" ${i===current?'aria-current="step"':""}><span class="step-number">${solved[i]?"✓":i+1}</span><span class="step-label">${t.title}</span></li>`).join("");
    }
    function render(){
      const t=tasks[current];
      $("quest-count").textContent=`Завдання ${current+1} із 10`;
      $("quest-title").textContent=t.title; $("story").textContent=t.story;
      $("problem").textContent=t.problem; $("rule").textContent=t.rule;
      $("fields").replaceChildren();
      t.labels.forEach((label,i)=>{
        const row=document.createElement("div");row.className="input-group";
        const lab=document.createElement("label");lab.htmlFor=`answer-${i}`;lab.textContent=label;
        const input=document.createElement("input");input.className="answer";input.id=`answer-${i}`;input.type="text";input.inputMode="numeric";input.autocomplete="off";input.setAttribute("aria-describedby","feedback");input.setAttribute("aria-label",`${label}, ${t.units[i]}`);input.maxLength=8;
        const unit=document.createElement("span");unit.className="unit";unit.textContent=t.units[i];
        row.append(lab,input,unit);$("fields").append(row);
      });
      $("hint").textContent=t.hint;$("hint").hidden=true;
      $("hint-button").setAttribute("aria-expanded","false");$("hint-button").textContent="Підказка";
      $("feedback").hidden=true;$("feedback").textContent="";$("feedback").className="feedback";
      $("check").disabled=false;$("finish").replaceChildren();updateMap();
      $("answer-0").focus();
    }
    $("hint-button").addEventListener("click",()=>{
      const show=$("hint").hidden;$("hint").hidden=!show;$("hint-button").setAttribute("aria-expanded",String(show));
      $("hint-button").textContent=show?"Сховати підказку":"Підказка";
    });
    $("answer-form").addEventListener("submit",event=>{
      event.preventDefault();if(solved[current])return;
      const t=tasks[current];const values=t.answers.map((_,i)=>$("answer-"+i).value.trim().replace(/\s/g,""));
      const fb=$("feedback");fb.hidden=false;fb.className="feedback";
      if(values.some(v=>!/^\d+$/.test(v))){fb.textContent="Впиши натуральне число або 0 у кожне поле.";return;}
      if(values.some((v,i)=>Number(v)!==t.answers[i])){fb.textContent="Поки що не збігається. Спробуй ще раз або відкрий підказку.";return;}
      solved[current]=true;fb.classList.add("success");fb.textContent=`Правильно! ${t.solution} +10 XP`;
      t.answers.forEach((_,i)=>$("answer-"+i).disabled=true);$("check").disabled=true;updateMap();
      const box=document.createElement("div");box.className="finish";
      if(current===tasks.length-1){
        box.innerHTML="<h3>Квест завершено! ✦</h3><p>Ти виконав усі 10 завдань і здобув 100 XP.</p>";
        const again=document.createElement("button");again.className="secondary";again.textContent="Пройти квест ще раз";again.addEventListener("click",()=>{solved.fill(false);current=0;render();});box.append(again);
      }else{
        const next=document.createElement("button");next.className="primary";next.textContent="Наступне завдання";next.addEventListener("click",()=>{current++;render();});box.append(next);
      }
      $("finish").append(box);box.querySelector("button").focus();
    });
    render();
  </script>
<a href="../../?class=5" style="position:fixed;bottom:12px;right:12px;z-index:9999;background:#fff;color:#21453f;padding:11px 16px;border:1px solid #aaa;border-radius:30px;font:600 14px system-ui;text-decoration:none;box-shadow:0 3px 15px #0002">← До квестів 5 класу</a></body>
