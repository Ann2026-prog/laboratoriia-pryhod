<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Енергопатруль</title><style>body{margin:0;background:#eef8f4;color:#123f3a;font:18px system-ui}main{max-width:850px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{background:#ffdc68;padding:8px 16px;border-radius:30px}h1{font-size:clamp(32px,7vw,60px);margin:25px 0 8px}p{line-height:1.6}.card{background:white;border-radius:28px;padding:clamp(20px,5vw,40px);box-shadow:0 10px 40px #135c4212;margin:24px 0}button{font:inherit;cursor:pointer;border:2px solid #b7d8ce;border-radius:16px;padding:16px;background:white;color:#123f3a;text-align:left}button:hover{border-color:#087766}button:focus-visible{outline:4px solid #e9ac21}button:disabled{cursor:default;opacity:.85}.choices{display:grid;gap:12px}.primary{background:#087766;color:white;border:0;margin-top:20px}progress{width:100%;height:14px;accent-color:#087766}.good{border-color:#087766;background:#e4f8eb}.bad{border-color:#cd613d;background:#fff0e9}#feedback{min-height:30px;margin-top:16px}small{line-height:1.5;display:block}footer{font-size:14px} @media(max-width:500px){main{padding:16px}header{font-size:14px}}</style><main><header><b>⚡ ЕНЕРГІЯ БЕЗ МАРНОТРАТСТВА</b><span class="tag" id="score">0 балів</span></header><h1>Енергопатруль</h1><p>Допоможи команді зберегти енергію та безпечно навчатися вдома.</p><progress id="progress" max="10" value="0" aria-label="Прогрес гри"></progress><section class="card" id="game"></section><footer>Гра для 5–9 класів · Без таймера · 10 місій<br>Дії з електроприладами узгоджуй із дорослими. Не вимикай холодильник, медичні прилади чи обладнання, потрібне для зв’язку.</footer></main><script>
const missions=[
['💡','Ти виходиш із кімнати. У ній нікого не залишилося. Що зробиш?',['Вимкну світло.','Залишу світло до вечора.','Увімкну ще одну лампу.'],0,'У порожній кімнаті зайве освітлення можна вимкнути.'],
['☀️','За вікном світло, але штори закриті. Як підготувати місце для читання?',['Читатиму в темряві.','Відкрию штори й перевірю, чи достатньо світла.','Вимкну все освітлення незалежно від умов.'],1,'Денне світло корисне, коли його достатньо. Якщо темно, потрібна лампа.'],
['📺','Телевізор працює, але його ніхто не дивиться.',['Зроблю звук тихішим.','Накрию телевізор.','Вимкну його з дозволу дорослих.'],2,'Прилад, який не потрібен, не варто залишати працювати.'],
['💻','Почався онлайн-урок. На ноутбуці відкриті гра та зайві вкладки.',['Закрию зайві програми й вкладки.','Запущу ще одну гру.','Залишу все відкритим.'],0,'Зайві програми відволікають і можуть збільшувати навантаження на пристрій.'],
['🔆','Яку яскравість екрана обрати?',['Завжди максимальну.','Комфортну для читання відповідно до освітлення.','Таку низьку, щоб ледве бачити текст.'],1,'Екран має бути добре читабельним. Не потрібно напружувати очі заради економії.'],
['🔋','Де безпечно заряджати телефон?',['Під подушкою.','Під ковдрою.','На твердій відкритій поверхні.'],2,'Не накривай гаджет і зарядний пристрій: тепло має вільно відводитися.'],
['🔌','Ти помітив пошкоджений кабель заряджання.',['Припиню користування й повідомлю дорослим.','Спробую полагодити його самостійно.','Продовжу заряджати телефон.'],0,'Пошкоджені кабелі не використовують. Попроси дорослих допомогти.'],
['🖐️','Після миття руки мокрі. Що зробиш перед користуванням електроприладом?',['Одразу торкнуся розетки.','Витру руки насухо.','Перевірю розетку мокрим пальцем.'],1,'Користуйся електроприладами сухими руками. Не вставляй сторонні предмети в розетки.'],
['🌙','Ти зробиш перерву в роботі за ноутбуком. Яке налаштування корисне?',['Вимкнути всі засоби захисту.','Залишити відео грати без потреби.','Налаштувати автоматичний режим сну.'],2,'Режим сну допомагає зменшити споживання під час перерв. Після завершення роботи можна вимкнути пристрій.'],
['🧘','Навчальний блок завершився. Як провести перерву?',['Відвести погляд від екрана й трохи порухатися.','Одразу почати гру на телефоні.','Не робити перерви.'],0,'Перерви без екрана дають відпочинок очам і можливість порухатися.']
];let idx=0,points=0,locked=false;
const box=document.getElementById('game');function render(){locked=false;document.getElementById('progress').value=idx;document.getElementById('score').textContent=points+' / 100 балів';if(idx===missions.length){box.innerHTML='<div style="font-size:60px">🏆</div><h2>Патруль завершено!</h2><p>Твій результат: <b>'+points+' із 100 балів</b>.</p><p>'+(points>=80?'Чудово! Ти знаєш, як берегти енергію та себе.':'Ти вже зробив важливий крок. Повтори місії, щоб закріпити правила.')+'</p><h3>Моя дія сьогодні</h3><p>Обери одну корисну звичку й перевір її після навчання.</p><button class="primary" id="restart">Грати ще раз</button>';document.getElementById('restart').onclick=()=>{idx=0;points=0;render()};return;}let m=missions[idx];box.innerHTML='<small>МІСІЯ '+(idx+1)+' / 10</small><div style="font-size:54px;margin-top:12px">'+m[0]+'</div><h2>'+m[1]+'</h2><div class="choices" id="choices"></div><div id="feedback" role="status" aria-live="polite"></div><button class="primary" id="next" hidden>Наступна місія →</button>';m[2].forEach((label,n)=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>answer(n);document.getElementById('choices').append(b)});document.getElementById('next').onclick=()=>{idx++;render()};}
function answer(n){if(locked)return;locked=true;let m=missions[idx],correct=n===m[3];if(correct)points+=10;const bs=[...document.querySelectorAll('#choices button')];bs.forEach((b,i)=>{b.disabled=true;if(i===m[3])b.classList.add('good');else if(i===n)b.classList.add('bad')});document.getElementById('score').textContent=points+' / 100 балів';document.getElementById('feedback').textContent=(correct?'✓ Правильно! +10 балів. ':'Спробуй запам’ятати правильну дію. ')+m[4];document.getElementById('next').hidden=false;}
render();
</script><a href="../../" style="position:fixed;bottom:12px;right:12px;z-index:9999;background:#fff;color:#21453f;padding:11px 16px;border:1px solid #aaa;border-radius:30px;font:600 14px system-ui;text-decoration:none;box-shadow:0 3px 15px #0002">← До каталогу</a></html>
